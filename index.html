<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoloLatino TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--card:#12121f;--accent:#e50914;--text:#e8e8f8;--dim:#6b6b8d;--focus-ring:#fff;--nav-bg:rgba(10,10,20,.97)}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}

#topnav{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 24px;z-index:100;background:var(--nav-bg);border-bottom:1px solid rgba(255,255,255,.06)}
#topnav .logo{font-size:26px;font-weight:700;letter-spacing:2px;margin-right:32px}
#topnav .logo span:first-child{color:var(--accent)}
.nav-btn{background:none;border:none;color:var(--dim);font-size:15px;padding:10px 16px;cursor:pointer;border-radius:8px;font-family:inherit}
.nav-btn.active,.nav-btn:focus-visible{color:#fff;background:rgba(255,255,255,.08)}

#search-wrap{flex:1;display:flex;margin-left:auto}
#search-input{width:100%;max-width:360px;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:14px;outline:none;font-family:inherit}
#search-input::placeholder{color:var(--dim)}

#search-results-wrap{position:absolute;top:64px;left:24px;right:24px;z-index:50;display:none;background:#12121f;border-radius:8px;overflow:hidden;max-height:60vh;overflow-y:auto}
#search-results-wrap.show{display:block}
.search-result-item{padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s}
.search-result-item.focused{background:rgba(229,9,20,.15)}
.search-result-img{width:40px;height:60px;object-fit:cover;border-radius:4px;background:#1a1a2e;flex-shrink:0}
.search-result-info{flex:1;min-width:0}
.sr-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-meta{font-size:11px;color:var(--dim)}

#main{padding-top:84px;padding-bottom:32px;height:100vh;overflow-y:auto;scroll-behavior:smooth}
#main::-webkit-scrollbar{width:6px}
#main::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

.section-header{padding:20px 24px 8px;font-size:18px;font-weight:700;color:var(--text)}
.card-grid{display:flex;gap:16px;padding:8px 24px 24px;overflow-x:auto;scroll-behavior:smooth}
.card-grid::-webkit-scrollbar{height:6px}
.card-grid::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

.card{flex-shrink:0;width:150px;cursor:pointer;border-radius:8px;background:var(--card);overflow:hidden;transition:transform .2s,z-index 0s}
.card.focused{outline:3px solid var(--focus-ring);outline-offset:-3px;z-index:10}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1a1a2e}
.card-info{padding:6px 8px}
.card-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.card-year{font-size:10px;color:var(--dim)}

.pagination{text-align:center;padding:20px 24px;display:flex;justify-content:center;gap:6px}
.page-btn{padding:8px 16px;background:rgba(255,255,255,.06);border:none;border-radius:6px;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.page-btn.focused{background:rgba(229,9,20,.3)}

#player-overlay{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column}
#player-overlay.show{display:flex}
#player-bar{height:52px;display:flex;align-items:center;padding:0 16px;gap:12px}
#player-back,#player-close{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:8px 14px;border-radius:6px;font-family:inherit}
#player-title{font-size:15px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#iframe-container{flex:1;padding:4px 4px 4px;overflow:hidden}
#player-iframe{width:100%;height:calc(100vh - 60px);border:none;background:#000}

#server-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
#server-modal.show{display:flex}
.modal-box{background:#16162a;border-radius:12px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:20px;font-weight:700;margin-bottom:4px}
.modal-subtitle{font-size:12px;color:var(--dim);margin-bottom:16px}
.server-btn{display:block;width:100%;padding:14px 16px;background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:8px;color:var(--text);font-size:15px;text-align:left;cursor:pointer;margin-bottom:6px;font-family:inherit}
.server-btn.focused{background:rgba(229,9,20,.15)}

#loading{text-align:center;padding:80px 24px;display:none}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.state-msg{text-align:center;padding:80px 24px;color:var(--dim);font-size:15px}

#direct-frame{position:fixed;top:64px;left:0;right:0;bottom:0;border:none;z-index:50;display:none;background:#0a0a14}
</style>
</head>
<body>

<nav id="topnav">
  <div class="logo" tabindex="-1"><span>SOLO</span>LATINO<span>.</span></div>
  <button class="nav-btn active" data-cat="movies" tabindex="-1">Películas</button>
  <button class="nav-btn" data-cat="series" tabindex="-1">Series</button>
  <button class="nav-btn" data-cat="anime" tabindex="-1">Anime</button>
  <button class="nav-btn" data-cat="doramas" tabindex="-1">Doramas</button>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="Buscar..." autocomplete="off" tabindex="-1">
  </div>
</nav>

<div id="search-results-wrap"></div>

<main id="main">
  <div id="loading"><div class="spinner"></div><p>Cargando...</p></div>
  <div id="content-area"></div>
</main>

<iframe id="direct-frame" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>

<div id="player-overlay">
  <div id="player-bar">
    <button id="player-back" tabindex="-1">&#8592; Volver</button>
    <span id="player-title"></span>
    <button id="player-close" tabindex="-1">&#x2715;</button>
  </div>
  <div id="iframe-container">
    <iframe id="player-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>
</div>

<div id="server-modal">
  <div class="modal-box">
    <div class="modal-title">Servidores disponibles</div>
    <div class="modal-subtitle" id="server-modal-title"></div>
    <div id="server-list"></div>
  </div>
</div>

<script>
// ═══════ CONFIG ═══════
const BASE = 'https://sololatino.net';

// ═══════ STATE ═══════
let currentCat = 'movies', currentPage = 1, focusedIndex = 0;
let focusableEls = [], searchResults = [], currentDetailData = null;

const $main = document.getElementById('main');
const $content = document.getElementById('content-area');
const $loading = document.getElementById('loading');
const $searchInput = document.getElementById('search-input');
const $searchWrap = document.getElementById('search-results-wrap');
const $playerOverlay = document.getElementById('player-overlay');
const $playerIframe = document.getElementById('player-iframe');
const $serverModal = document.getElementById('server-modal');
const $serverListEl = document.getElementById('server-list');
const $serverModalTitle = document.getElementById('server-modal-title');
const $directFrame = document.getElementById('direct-frame');

// ═══════ FETCH (DIRECT → PROXY FALLBACK) ═══════
async function fetchPage(path, retries = 2) {
  // Try direct first
  for (let a = 0; a <= retries; a++) {
    try {
      const url = BASE + path + (path.includes('?') ? '&' : '?') + '_=' + Date.now();
      console.log('Direct fetch:', url);
      const res = await fetch(url, { headers: { 'Accept-Language': 'es-419,es;q=0.9' }, signal: AbortSignal.timeout(12000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (text.length > 5000) return text; // Valid content
      throw new Error('Respuesta muy corta');
    } catch (e) {
      console.warn('Direct fetch attempt', a + 1, 'failed:', e.message);
      if (a < retries) await sleep(2000 * (a + 1));
    }
  }

  // Fallback: try CORS proxies in sequence
  const proxyUrl = BASE + path;
  
  for (const proxy of [
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`
  ]) {
    try {
      const url = proxy(proxyUrl);
      console.log('Proxy fetch:', url.substring(0, 80));
      const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (text.length > 5000) return text;
    } catch (e) {
      console.warn('Proxy failed:', e.message);
    }
  }

  // Last resort: try the page itself as iframe source and parse via DOM
  throw new Error('No se pudo cargar el contenido. Intenta de nuevo.');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════ JSON-LD PARSER ═══════
function extractCatalogFromJsonLd(html) {
  const items = [];
  
  // Find all script[type="application/ld+json"] blocks
  const regex = /<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  let match;
  
  while ((match = regex.exec(html))) {
    try {
      const data = JSON.parse(match[1]);
      
      // Check @graph for ItemList
      if (data['@graph']) {
        for (const node of data['@graph']) {
          processItem(node, items);
        }
      } else {
        processItem(data, items);
      }
    } catch {}
  }

  // Deduplicate by URL
  const seen = new Set();
  return items.filter(item => {
    if (seen.has(item.url)) return false;
    seen.add(item.url);
    return true;
  });
}

function processItem(node, items) {
  // ItemList with itemListElement
  if (node['@type'] === 'ItemList' && node.itemListElement) {
    for (const el of node.itemListElement) {
      const url = el.url || '';
      if (!url.includes('/pelicula/') && !url.includes('/serie/')) continue;
      
      items.push({
        slug: url.split('/').pop(),
        name: el.name || '',
        image: el.image || '',
        type: url.includes('/pelicula/') ? 'movie' : 'series'
      });
    }
  }

  // Individual Movie/Series/TVSeries in @graph (has WatchAction)
  if (node.potentialAction && node.potentialAction.target && node.name && !node.itemListElement) {
    const target = Array.isArray(node.potentialAction.target) ? node.potentialAction.target[0] : node.potentialAction.target;
    if (target.urlTemplate || (typeof target === 'string' && target.includes('/pelicula/'))) {
      // This is a detail page item, not needed for catalog
    }
  }

  // Direct ListItem in @graph
  if (node['@type'] === 'ListItem') {
    const url = node.url || '';
    if ((url.includes('/pelicula/') || url.includes('/serie/')) && node.name) {
      items.push({
        slug: url.split('/').pop(),
        name: node.name,
        image: node.image || '',
        type: url.includes('/pelicula/') ? 'movie' : 'series'
      });
    }
  }
}

// ═══════ SEARCH PARSER (HTML-based) ═══════
function extractSearchResults(html) {
  const items = [];
  
  // Search results use JSON-LD too - look for VideoObject or Movie items
  const regex = /<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  let match;
  
  while ((match = regex.exec(html))) {
    try {
      const data = JSON.parse(match[1]);
      
      if (data['@graph']) {
        for (const node of data['@graph']) {
          // Look for VideoObject or Movie/TVSeries with url containing /pelicula/ or /serie/
          if ((node['@type'] === 'VideoObject' || node['@type'] === 'Movie' || node['@type'] === 'TVSeries') && node.url) {
            const url = node.url;
            if (url.includes('/pelicula/') || url.includes('/serie/')) {
              items.push({
                slug: url.split('/').pop(),
                name: node.name || '',
                image: node.thumbnailUrl || node.image || '',
                type: url.includes('/pelicula/') ? 'movie' : 'series',
                description: node.description || ''
              });
            }
          }
        }
      }
    } catch {}
  }

  // Fallback: HTML-based parsing for search results
  if (!items.length) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    
    // Search results are in a list structure
    const links = Array.from(doc.querySelectorAll('a[href]')).filter(a => {
      const h = (a.getAttribute('href') || '').toLowerCase();
      return h.startsWith('/pelicula/') || h.startsWith('/serie/');
    });

    for (const link of links.slice(0, 25)) {
      const href = link.getAttribute('href');
      
      let title = '';
      const imgEl = link.querySelector('img');
      if (imgEl && imgEl.alt) title = imgEl.alt.trim();
      else {
        // Get text from all children
        const texts = Array.from(link.querySelectorAll('span, div')).map(s => s.textContent).join(' ');
        title = texts.trim().replace(/\s+/g, ' ').substring(0, 80);
      }

      if (!title) {
        const fullText = link.textContent.trim().replace(/\s+/g, ' ');
        if (fullText.length > 2 && fullText.length < 100) title = fullText;
      }

      let poster = '';
      if (imgEl && imgEl.src) poster = imgEl.src.replace(/\/w\d+\/?/, '/w500');

      const exists = items.find(i => i.slug === href.split('/').pop());
      if (!exists && title) {
        items.push({ slug: href.split('/').pop(), name: title, image: poster, type: href.startsWith('/serie/') ? 'series' : 'movie' });
      }

      if (items.length >= 20) break;
    }
  }

  return items;
}

// ═══════ PLAYER LINKS PARSER ═══════
function extractPlayerLinks(html) {
  const servers = [];

  // JSON-LD WatchAction URL
  const regex = /<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  let match;
  
  while ((match = regex.exec(html))) {
    try {
      const data = JSON.parse(match[1]);
      
      if (data['@graph']) {
        for (const node of data['@graph']) {
          if (node.potentialAction && node.potentialAction.target) {
            const target = Array.isArray(node.potentialAction.target) ? node.potentialAction.target[0] : node.potentialAction.target;
            
            // WatchAction with direct URL
            if (target.url || typeof target === 'string') {
              const url = typeof target === 'object' ? target.url : target;
              if (url && (url.includes('/pelicula/') || url.includes('/serie/'))) {
                servers.push({ name: 'Principal', url: BASE + '/' + url.split('/').slice(3).join('/') });
              }
            }
          }
        }
      } else if (data.potentialAction && data.potentialAction.target) {
        const target = Array.isArray(data.potentialAction.target) ? data.potentialAction.target[0] : data.potentialAction.target;
        const url = typeof target === 'object' ? target.url : target;
        if (url) servers.push({ name: 'Principal', url });
      }
    } catch {}
  }

  // Direct iframe extraction from HTML
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  
  doc.querySelectorAll('iframe[src]').forEach(iframe => {
    const src = iframe.getAttribute('src');
    if (src && !servers.find(s => s.url === src)) {
      let name = 'Servidor';
      try { name = new URL(src).hostname.replace('www.', ''); } catch {}
      servers.push({ name, url: src });
    }
  });

  // Links to video hosts
  const hostPatterns = ['embed69', 'xupalace', 'streamtape', 'doodcdn', 'filemoon'];
  doc.querySelectorAll('a[href]').forEach(link => {
    const href = link.getAttribute('href') || '';
    if (hostPatterns.some(p => href.toLowerCase().includes(p))) {
      let name = 'Servidor';
      try { name = new URL(href).hostname.replace('www.', ''); } catch {}
      servers.push({ name, url: href });
    }
  });

  // Fallback
  if (!servers.length) {
    const slugMatch = html.match(/\/(pelicula|serie)\/([^"']+)/);
    if (slugMatch) {
      servers.push({ name: 'Reproductor Principal', url: BASE + '/' + slugMatch[1] + '/' + slugMatch[2] });
    } else {
      const path = window.location.pathname;
      servers.push({ name: 'Página del contenido', url: BASE + path });
    }
  }

  return servers;
}

// ═══════ RENDERING ═══════
function showLoading(v) { $loading.style.display = v ? 'block' : 'none'; }

function renderCards(items, catLabel) {
  if (!items.length) {
    $content.innerHTML = '<div class="state-msg"><div style="font-size:40px;margin-bottom:12px">🎬</div>No se encontraron resultados</div>';
    return;
  }

  let html = `<div class="section-header">${esc(catLabel)}</div>`;
  html += '<div class="card-grid" id="grid-main">';
  
  items.forEach(item => {
    const posterSrc = item.image || '';
    html += `
      <div class="card" data-url="${BASE}/${item.type === 'movie' ? 'pelicula' : 'serie'}/${item.slug}" tabindex="-1">
        ${posterSrc ? `<img class="card-img" src="${posterSrc}" alt="" loading="lazy" onerror="this.style.display='none'">` : '<div class="card-img"></div>'}
        <div class="card-info"><div class="card-title">${esc(item.name)}</div></div>
      </div>`;
  });
  
  html += '</div>';

  // Pagination
  html += '<div class="pagination" id="pag-area">';
  if (currentPage > 1) html += `<button class="page-btn" data-page="${currentPage - 1}" tabindex="-1">&#8592; Anterior</button>`;
  
  const start = Math.max(1, currentPage - 1);
  for (let i = start; i <= Math.min(currentPage + 3, currentPage + 4); i++) {
    html += `<button class="page-btn ${i === currentPage ? '' : ''}" data-page="${i}" tabindex="-1">${i}</button>`;
  }
  
  html += `<button class="page-btn" data-page="${currentPage + 1}" tabindex="-1">Siguiente &#8594;</button>`;
  html += '</div>';

  $content.innerHTML = html;
  buildFocusable();
}

function renderSearchResults() {
  if (!searchResults.length) {
    $searchWrap.classList.remove('show');
    return;
  }

  $searchWrap.innerHTML = searchResults.map((r, i) => `
    <div class="search-result-item" data-index="${i}" tabindex="-1">
      ${r.image ? `<img class="search-result-img" src="${r.image}" alt="" loading="lazy">` : '<div class="search-result-img"></div>'}
      <div class="search-result-info"><div class="sr-title">${esc(r.name)}</div><div class="sr-meta">${r.type === 'series' ? 'Serie' : 'Pelicula'}${r.description ? ' - ' + esc(r.description.substring(0, 60)) : ''}</div></div>
    </div>`).join('');

  $searchWrap.classList.add('show');
}

// ═══════ FOCUS MANAGEMENT ═══════
function buildFocusable() {
  focusableEls = [];
  
  document.querySelectorAll('#topnav .nav-btn').forEach(btn => focusableEls.push(btn));
  const contentElms = Array.from($content.querySelectorAll('.card, .episode-card, .server-btn, .page-btn'));
  focusableEls.push(...contentElms);

  focusedIndex = Math.min(focusedIndex, focusableEls.length - 1);
  if (focusedIndex < 0) focusedIndex = 0;
  
  applyFocus();
}

function applyFocus() {
  document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
  
  const el = focusableEls[focusedIndex];
  if (!el) return;
  
  el.classList.add('focused');
  
  // Auto-scroll cards into view
  if (el.classList.contains('card')) {
    const parent = el.parentElement;
    if (parent) {
      const offset = el.offsetLeft - parent.offsetWidth / 2 + el.offsetWidth / 2;
      parent.scrollTo({ left: Math.max(0, offset), behavior: 'smooth' });
    }
  }
  
  $main.scrollTop = Math.max(0, el.offsetTop - 120);
}

function focusNext() { if (focusableEls.length) { focusedIndex = Math.min(focusedIndex + 1, focusableEls.length - 1); applyFocus(); } }
function focusPrev() { if (focusableEls.length) { focusedIndex = Math.max(focusedIndex - 1, 0); applyFocus(); } }

// ═══════ NAVIGATION ═══════
async function loadCategory(cat, page) {
  currentCat = cat;
  currentPage = page || 1;
  
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.querySelector(`.nav-btn[data-cat="${cat}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  $searchWrap.classList.remove('show');
  showLoading(true);
  
  try {
    let path;
    switch(cat) {
      case 'movies': path = `/peliculas?page=${currentPage}`; break;
      case 'series': path = `/series?page=${currentPage}`; break;
      case 'anime': path = `/animes?page=${currentPage}`; break;
      case 'doramas': path = `/doramas?page=${currentPage}`; break;
    }
    
    const html = await fetchPage(path);
    const items = extractCatalogFromJsonLd(html);
    
    const labels = { movies: 'Películas', series: 'Series', anime: 'Anime', doramas: 'Doramas' };
    renderCards(items, labels[cat]);
    
  } catch (e) {
    console.error(e);
    $content.innerHTML = `<div class="state-msg"><div style="font-size:40px;margin-bottom:12px">⚠️</div>${esc(e.message)}<br><small>Intenta refrescar la página o verifica tu conexión.</small></div>`;
  }
  
  showLoading(false);
}

async function openDetail(slug) {
  showLoading(true);
  $main.scrollTop = 0;
  
  try {
    const html = await fetchPage(`/${slug}`);
    
    currentDetailData = {
      slug,
      title: slug.split('/').pop().replace(/-/g, ' '),
      servers: extractPlayerLinks(html)
    };

    renderServerModal(currentDetailData.title, currentDetailData.servers);
    
  } catch (e) {
    console.error(e);
    $content.innerHTML = `<div class="state-msg"><div style="font-size:40px;margin-bottom:12px">⚠️</div>No se pudo cargar.<br><small>${esc(e.message)}</small></div>`;
  }
  
  showLoading(false);
}

function renderServerModal(title, servers) {
  if (!servers || !servers.length) return;
  
  $serverModalTitle.textContent = title;
  $serverListEl.innerHTML = servers.map((s, i) => 
    `<button class="server-btn" data-url="${esc(s.url)}">${esc(s.name)}</button>`
  ).join('');
  
  $serverModal.classList.add('show');
}

function playServer(url) {
  if (url.startsWith(BASE)) {
    // Open in direct iframe overlay
    $directFrame.src = url;
    $directFrame.style.display = 'block';
    
    const backBtn = document.createElement('div');
    backBtn.id = 'frame-back-btn';
    backBtn.style.cssText = 'position:fixed;top:72px;left:16px;z-index:55;cursor:pointer;padding:8px 14px;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;font-size:14px;font-family:inherit';
    backBtn.textContent = '← Volver';
    backBtn.onclick = closeDirectFrame;
    document.body.appendChild(backBtn);
  } else {
    $playerIframe.src = url;
    $serverModal.classList.remove('show');
    $playerOverlay.classList.add('show');
    
    setTimeout(() => {
      const closeBtn = document.getElementById('player-close');
      if (closeBtn) closeBtn.classList.add('focused');
    }, 200);
  }
}

function closeDirectFrame() {
  $directFrame.src = '';
  $directFrame.style.display = 'none';
  const overlay = document.getElementById('frame-back-btn');
  if (overlay) overlay.remove();
  
  buildFocusable();
}

function closePlayer() {
  $playerIframe.src = '';
  $serverModal.classList.remove('show');
  $playerOverlay.classList.remove('show');
  buildFocusable();
}

// ═══════ SEARCH ═══════
let searchTimeout;
async function doSearch(query) {
  if (!query || query.length < 3) {
    $searchWrap.classList.remove('show');
    return;
  }

  try {
    const html = await fetchPage(`/buscar?q=${encodeURIComponent(query)}`);
    searchResults = extractSearchResults(html);
    renderSearchResults();
  } catch (e) {
    console.error('Search error:', e);
    searchResults = [];
    $searchWrap.classList.remove('show');
  }
}

// ═══════ KEYBOARD / REMOTE CONTROL ═══════
document.addEventListener('keydown', (e) => {
  let key = e.key;
  // Samsung TV remote: red Back button sends 'Back' (keyCode 10008), not Escape
  if (key === 'Back' || e.keyCode === 10008) key = 'Escape';
  else if (key === 'Return') key = 'Enter';

  // Direct frame mode
  if ($directFrame.style.display === 'block') {
    if (key === 'Escape' || key === 'Backspace' || key === 'Return') { closeDirectFrame(); e.preventDefault(); return; }
    if (key === 'ArrowRight') { focusNext(); e.preventDefault(); return; }
    if (key === 'ArrowLeft') { focusPrev(); e.preventDefault(); return; }
  }

  // Player overlay
  if ($playerOverlay.classList.contains('show')) {
    if (key === 'Escape' || key === 'Backspace') { closePlayer(); e.preventDefault(); return; }
    if (key === 'ArrowRight') { focusNext(); e.preventDefault(); return; }
    if (key === 'ArrowLeft') { focusPrev(); e.preventDefault(); return; }
    if (key === 'Enter' || key === 'OK') { activateFocused(); return; }
  }

  // Server modal
  if ($serverModal.classList.contains('show')) {
    if (key === 'Escape') { $serverModal.classList.remove('show'); e.preventDefault(); return; }
    if (key === 'ArrowDown' || key === 'ArrowRight') { focusNext(); e.preventDefault(); return; }
    if (key === 'ArrowUp' || key === 'ArrowLeft') { focusPrev(); e.preventDefault(); return; }
    if (key === 'Enter' || key === 'OK') { activateFocused(); return; }
  }

  // Search results
  if ($searchWrap.classList.contains('show')) {
    const srEls = $searchWrap.querySelectorAll('.search-result-item');
    
    if (key === 'Escape') { $searchWrap.classList.remove('show'); e.preventDefault(); return; }
    
    if (key === 'ArrowDown' || key === 'ArrowRight') {
      focusedIndex = Math.min(focusedIndex + 1, srEls.length - 1);
      applyFocusSearch(srEls);
      e.preventDefault(); return;
    }

    if (key === 'ArrowUp' || key === 'ArrowLeft') {
      if (focusedIndex < srEls.length) focusedIndex = 0;
      else focusedIndex = Math.max(focusedIndex - 1, 0);
      
      if (focusedIndex >= srEls.length) applyFocus();
      else applyFocusSearch(srEls);
      e.preventDefault(); return;
    }

    if (key === 'Enter' || key === 'OK') { activateFocused(); e.preventDefault(); return; }
  }

  // Search input
  if (document.activeElement === $searchInput) {
    if (key === 'Escape') { $searchWrap.classList.remove('show'); $searchInput.blur(); e.preventDefault(); return; }
    if (key === 'Enter' && searchResults.length > 0) { activateFocused(); e.preventDefault(); return; }
    return;
  }

  // Main content
  switch(key) {
    case 'ArrowRight': case 'ArrowDown': focusNext(); e.preventDefault(); break;
    case 'ArrowLeft': case 'ArrowUp': focusPrev(); e.preventDefault(); break;
    case 'Enter': case 'OK': activateFocused(); e.preventDefault(); break;
    case 'Escape': closePlayer(); $searchWrap.classList.remove('show'); break;
  }
});

function applyFocusSearch(items) {
  document.querySelectorAll('.search-result-item.focused').forEach(el => el.classList.remove('focused'));
  if (items[focusedIndex]) { items[focusedIndex].classList.add('focused'); items[focusedIndex].scrollIntoView({ block: 'nearest' }); }
}

// ═══════ EVENT HANDLERS ═══════
function activateFocused() {
  const el = focusableEls[focusedIndex];
  if (!el) return;

  // Nav buttons
  if (el.classList.contains('nav-btn')) { loadCategory(el.dataset.cat, 1); focusedIndex = Math.min(focusedIndex + 1, focusableEls.length - 1); applyFocus(); return; }

  // Page buttons
  if (el.dataset.page !== undefined) { loadCategory(currentCat, parseInt(el.dataset.page)); focusedIndex = Math.min(focusedIndex + 1, focusableEls.length - 1); applyFocus(); return; }

  // Search results
  if (el.classList.contains('search-result-item')) {
    const item = searchResults[parseInt(el.dataset.index)];
    if (item) openDetail(item.slug);
    $searchWrap.classList.remove('show');
    return;
  }

  // Server buttons
  if (el.classList.contains('server-btn')) {
    playServer(el.dataset.url);
    return;
  }

  // Cards
  if (el.classList.contains('card')) {
    const url = el.dataset.url;
    if (url) openDetail(url.replace(BASE + '/', ''));
    return;
  }

  // Player buttons
  if (el.id === 'player-close') { closePlayer(); return; }
  if (el.id === 'player-back') { closePlayer(); return; }
}

// Nav click handlers
document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => loadCategory(btn.dataset.cat, 1)));

// Search with debounce
$searchInput.addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => doSearch($searchInput.value.trim()), 700); });
$searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Return') { e.preventDefault(); const q = $searchInput.value.trim(); if (q.length >= 3) doSearch(q); } });

// ═══════ UTILS ═══════
function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

// ═══════ INIT ═══════
async function init() {
  showLoading(true);
  try { await loadCategory(currentCat, currentPage); } catch (e) {
    $content.innerHTML = `<div class="state-msg"><div style="font-size:40px;margin-bottom:12px">⚠️</div>No se pudo conectar.<br><small>Verifica tu conexión a internet.</small></div>`;
  }
  showLoading(false);
}

init();
</script>
